@if (rows().length === 0) {
  <app-empty-state
    title="No hay citas para hoy"
    description="Cuando reserves una cita aparecerá aquí, ordenada por hora de inicio."
    actionLabel="Crear la primera cita"
    (action)="createRequested.emit()"
  />
} @else {
  <ul class="list">
    @for (row of rows(); track row.appointment.id) {
      <li
        class="appointment"
        [class.appointment--confirmed]="row.appointment.status === 'confirmed'"
        [class.appointment--pending]="row.appointment.status === 'pending'"
        [class.appointment--completed]="row.appointment.status === 'completed'"
        role="button"
        tabindex="0"
        animate.enter="appointment--entering"
        (click)="selectAppointment(row, $event)"
        (keydown)="selectAppointment(row, $event)"
      >
        <p class="appointment__time">
          <app-icon name="clock" />
          <time [attr.datetime]="row.appointment.startTime">{{ row.appointment.startTime }}</time>
        </p>

        <div class="appointment__details">
          <p class="appointment__client">{{ row.appointment.clientName }}</p>
          <p class="appointment__service">
            {{ row.appointment.serviceName }}
            <span class="appointment__duration">{{ row.durationLabel }}</span>
          </p>
        </div>

        <app-status-badge class="appointment__status" [status]="row.appointment.status" />
      </li>
    }
  </ul>
}
